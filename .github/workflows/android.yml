name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build web assets
        run: npm run build:web

      - name: Prepare Android assets
        run: node scripts/prepare-android.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon
        working-directory: android

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ../JuYingTV-Android-1.0.1.apk
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: JuYingTV-Android
          path: JuYingTV-Android-1.0.1.apk
          if-no-files-found: error
